<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>AgriTimeline - Interactive Timeline</title>
    <meta
      name="description"
      content="AgriTimeline — an interactive timeline exploring a century of Dutch agricultural heritage (1925–2025). Discover the history of farming in the Netherlands."

      name="keywords"

    <meta
      property="og:title"
      content="AgriTimeline - A Century of Dutch Farming"
    />

      property="og:description"
      content="Explore a century of Dutch agricultural heritage through an interactive timeline."

    <meta property="og:image" content="/images/og-image.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com" />

      name="twitter:title"
      content="AgriTimeline - A Century of Dutch Farming"
    />

      name="twitter:description"
      content="Explore a century of Dutch agricultural heritage through an interactive timeline."
